<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedPrice Aggregator | Hackathon Solution</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #00a8cc;
            --primary-hover: #008ba8;
            --bg-color: #f4f9f9;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --border-color: #e0e6ed;
            --min-price: #2ecc71;
            --max-price: #e74c3c;
            --min-bg: #eafaf1;
            --max-bg: #fdedec;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Зона Drag and Drop */
        .dropzone {
            background: var(--card-bg);
            border: 2px dashed var(--primary);
            border-radius: 12px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            position: relative;
        }

        .dropzone.dragover {
            background: #e1f5fe;
            border-color: var(--primary-hover);
            transform: scale(1.02);
        }

        .dropzone i {
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .dropzone h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .dropzone input[type="file"] {
            display: none;
        }

        /* Индикатор загрузки */
        .loader {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Рабочая зона (Таблица и управление) */
        .dashboard {
            display: none;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 400px;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .btn-export {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-export:hover {
            background: var(--primary-hover);
        }

        /* Таблица */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background: var(--bg-color);
            font-weight: 600;
            color: var(--text-muted);
        }

        tbody tr:hover {
            background-color: #f9fbfc;
        }

        /* Подсветка цен */
        .price-min {
            color: var(--min-price);
            font-weight: bold;
            background-color: var(--min-bg);
            border-radius: 4px;
            padding: 4px 8px;
        }

        .price-max {
            color: var(--max-price);
            font-weight: bold;
            background-color: var(--max-bg);
            border-radius: 4px;
            padding: 4px 8px;
        }

        .status-message {
            margin-top: 10px;
            font-weight: bold;
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><i class="fas fa-heartbeat"></i> MedPrice Aggregator</h1>
        <p>Автоматическая обработка и сравнение прайс-листов клиник-партнеров</p>
    </header>

    <div class="dropzone" id="dropzone">
        <i class="fas fa-file-zipper"></i>
        <h3>Перетащите ZIP-архив с прайсами сюда</h3>
        <p>или кликните для выбора файла</p>
        <input type="file" id="fileInput" accept=".zip">
        <div class="status-message" id="statusMessage"></div>
    </div>

    <div class="loader" id="loader">
        <div class="spinner"></div>
        <h3 id="loaderText">Анализ файлов и извлечение данных...</h3>
    </div>

    <div class="dashboard" id="dashboard">
        <div class="controls">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Поиск по услугам (например, УЗИ)...">
            </div>
            <button class="btn-export" id="exportBtn">
                <i class="fas fa-file-excel"></i> Экспорт базы
            </button>
        </div>

        <div class="table-container">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>Клиника</th>
                        <th>Наименование услуги</th>
                        <th>Стоимость (KZT)</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let globalData = []; // Объединенная база прайсов

    // Элементы DOM
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const loader = document.getElementById('loader');
    const dashboard = document.getElementById('dashboard');
    const tableBody = document.getElementById('tableBody');
    const searchInput = document.getElementById('searchInput');
    const statusMessage = document.getElementById('statusMessage');
    const exportBtn = document.getElementById('exportBtn');

    // Drag and Drop события
    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
    });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
        if (e.dataTransfer.files.length) {
            handleFile(e.dataTransfer.files[0]);
        }
    });
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) {
            handleFile(e.target.files[0]);
        }
    });

    // Основная функция обработки файла
    async function handleFile(file) {
        if (!file.name.toLowerCase().endsWith('.zip')) {
            showError("Пожалуйста, загрузите ZIP-архив.");
            return;
        }

        showLoader();
        globalData = [];
        
        try {
            const zip = new JSZip();
            const loadedZip = await zip.loadAsync(file);
            const excelFiles = Object.keys(loadedZip.files).filter(name => 
                !loadedZip.files[name].dir && name.match(/\.(xlsx|xls)$/i)
            );

            if (excelFiles.length === 0) {
                throw new Error("В архиве не найдено файлов Excel (.xlsx, .xls)");
            }

            for (let filename of excelFiles) {
                const fileData = await loadedZip.files[filename].async("arraybuffer");
                processExcel(fileData, extractFileName(filename));
            }

            hideLoader();
            showDashboard();
            renderTable();

        } catch (error) {
            hideLoader();
            showError("Ошибка обработки: " + error.message);
        }
    }

    // Обработка единичного Excel файла
    function processExcel(arrayBuffer, clinicName) {
        try {
            const workbook = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array' });
            const sheetName = workbook.SheetNames[0];
            const sheet = workbook.Sheets[sheetName];
            
            // Читаем лист как массив массивов
            const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1 });
            
            let nameIdx = -1;
            let priceIdx = -1;
            let startRow = -1;

            // Умный поиск колонок по ключевым словам
            const nameKeywords = ['услуг', 'наименован', 'процедур', 'исследован'];
            const priceKeywords = ['цен', 'стоимост', 'тенге', 'kzt'];

            for (let i = 0; i < Math.min(jsonData.length, 20); i++) {
                const row = jsonData[i];
                if (!row) continue;

                for (let j = 0; j < row.length; j++) {
                    const cellVal = String(row[j] || '').toLowerCase();
                    if (nameIdx === -1 && nameKeywords.some(kw => cellVal.includes(kw))) nameIdx = j;
                    if (priceIdx === -1 && priceKeywords.some(kw => cellVal.includes(kw))) priceIdx = j;
                }

                if (nameIdx !== -1 && priceIdx !== -1) {
                    startRow = i + 1;
                    break;
                }
            }

            // Извлечение данных
            if (startRow !== -1) {
                for (let i = startRow; i < jsonData.length; i++) {
                    const row = jsonData[i];
                    if (!row || row.length === 0) continue;
                    
                    const service = String(row[nameIdx] || '').trim();
                    let priceStr = String(row[priceIdx] || '').replace(/[^\d.,]/g, '').replace(',', '.');
                    const price = parseFloat(priceStr);

                    if (service && service.length > 2 && !isNaN(price)) {
                        globalData.push({ clinic: clinicName, service: service, price: price });
                    }
                }
            }
        } catch (e) {
            console.error(`Ошибка при чтении ${clinicName}:`, e);
        }
    }

    // Рендер таблицы с аналитикой
    function renderTable() {
        const searchTerm = searchInput.value.toLowerCase().trim();
        tableBody.innerHTML = '';

        // Фильтрация
        let filteredData = globalData;
        if (searchTerm) {
            filteredData = globalData.filter(item => 
                item.service.toLowerCase().includes(searchTerm)
            );
        }

        // Вычисление min/max цен для подсветки (агрегация по точному названию услуги)
        const priceStats = {};
        filteredData.forEach(item => {
            const srv = item.service.toLowerCase();
            if (!priceStats[srv]) {
                priceStats[srv] = { min: item.price, max: item.price, count: 1 };
            } else {
                priceStats[srv].min = Math.min(priceStats[srv].min, item.price);
                priceStats[srv].max = Math.max(priceStats[srv].max, item.price);
                priceStats[srv].count++;
            }
        });

        // Создание строк
        filteredData.forEach(item => {
            const tr = document.createElement('tr');
            
            const tdClinic = document.createElement('td');
            tdClinic.textContent = item.clinic;
            
            const tdService = document.createElement('td');
            tdService.textContent = item.service;
            
            const tdPrice = document.createElement('td');
            
            // Логика подсветки
            const srvStat = priceStats[item.service.toLowerCase()];
            let priceHTML = item.price.toLocaleString('ru-RU');
            
            if (srvStat.count > 1 && srvStat.min !== srvStat.max) {
                if (item.price === srvStat.min) {
                    priceHTML = `<span class="price-min" title="Самая выгодная цена!"><i class="fas fa-arrow-down"></i> ${priceHTML}</span>`;
                } else if (item.price === srvStat.max) {
                    priceHTML = `<span class="price-max" title="Самая высокая цена"><i class="fas fa-arrow-up"></i> ${priceHTML}</span>`;
                }
            }

            tdPrice.innerHTML = priceHTML;
            
            tr.appendChild(tdClinic);
            tr.appendChild(tdService);
            tr.appendChild(tdPrice);
            tableBody.appendChild(tr);
        });

        if (filteredData.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Нет данных или услуги не найдены</td></tr>';
        }
    }

    // Экспорт в Excel
    exportBtn.addEventListener('click', () => {
        if (globalData.length === 0) return;
        
        const worksheet = XLSX.utils.json_to_sheet(globalData.map(item => ({
            "Клиника": item.clinic,
            "Услуга": item.service,
            "Цена (KZT)": item.price
        })));

        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Merged Prices");
        
        XLSX.writeFile(workbook, "MedPrice_Aggregated.xlsx");
    });

    // Поиск
    searchInput.addEventListener('input', () => {
        renderTable();
    });

    // Утилиты
    function extractFileName(path) {
        return path.split('/').pop().replace(/\.(xlsx|xls)$/i, '');
    }

    function showLoader() {
        dropzone.style.display = 'none';
        dashboard.style.display = 'none';
        loader.style.display = 'block';
        statusMessage.textContent = '';
    }

    function hideLoader() {
        loader.style.display = 'none';
    }

    function showDashboard() {
        dropzone.style.display = 'none';
        dashboard.style.display = 'block';
    }

    function showError(msg) {
        statusMessage.textContent = msg;
        statusMessage.style.color = 'var(--max-price)';
        dropzone.style.display = 'block';
    }
</script>

</body>
</html>
