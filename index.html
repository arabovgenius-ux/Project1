<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Го в Бравл?</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ffe4f0 0%, #ffc2e0 50%, #ffaad6 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* floating hearts bg */
    body::before {
      content: '💗 💕 💖 💗 💕';
      position: fixed;
      top: -40px; left: 0; right: 0;
      font-size: 2rem;
      text-align: center;
      letter-spacing: 3rem;
      opacity: 0.18;
      animation: floatHearts 8s linear infinite;
      pointer-events: none;
      white-space: nowrap;
    }
    @keyframes floatHearts {
      from { transform: translateY(0); }
      to   { transform: translateY(110vh); }
    }

    .card {
      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(12px);
      border-radius: 32px;
      padding: 40px 36px 36px;
      max-width: 360px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(255,100,180,0.18);
      border: 2px solid rgba(255,180,220,0.5);
    }

    .photo-wrap {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      margin: 0 auto 24px;
      overflow: hidden;
      border: 4px solid #ff85c2;
      box-shadow: 0 4px 20px rgba(255,100,180,0.3);
    }

    .photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* placeholder if no image */
    .photo-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #ff85c2, #ffb3d9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 900;
      color: #d63384;
      margin-bottom: 6px;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 1rem;
      color: #e06fa0;
      margin-bottom: 28px;
      font-weight: 700;
    }

    .question {
      font-size: 1.25rem;
      font-weight: 900;
      color: #c2185b;
      margin-bottom: 28px;
    }

    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: center;
      min-height: 60px;
      position: relative;
    }

    .btn-yes {
      background: linear-gradient(135deg, #ff4da6, #ff85c2);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 14px 36px;
      font-size: 1.1rem;
      font-weight: 900;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(255,77,166,0.35);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-yes:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 24px rgba(255,77,166,0.45);
    }
    .btn-yes:active {
      transform: scale(0.97);
    }

    .btn-no {
      background: rgba(255,255,255,0.7);
      color: #e06fa0;
      border: 2px solid #ffb3d9;
      border-radius: 50px;
      padding: 14px 36px;
      font-size: 1.1rem;
      font-weight: 900;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      position: absolute;
      right: 0;
      transition: left 0.05s, top 0.05s;
      white-space: nowrap;
      user-select: none;
    }

    /* yes modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255,180,220,0.45);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal {
      background: white;
      border-radius: 28px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 8px 40px rgba(255,100,180,0.25);
      animation: popIn 0.3s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes popIn {
      from { transform: scale(0.6); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .modal .emoji { font-size: 3rem; margin-bottom: 12px; }
    .modal h2 { color: #d63384; font-size: 1.5rem; font-weight: 900; }
  </style>
</head>
<body>

  <div class="card">
    <div class="photo-wrap">
      <!-- <img src="B92D47B9-326A-4EDF-B2FF-2F8A46A0F710_AC35B53D-02D0-44EA-A3B0-F54A00C748EB.jpeg" alt="фото" /> -->
    </div>

    <h1>Го в Бравл Старс? 🎮</h1>
    <p class="subtitle">не откажешься же...</p>

    <p class="question">Сыграем вместе? 🌸</p>

    <div class="buttons" id="btnArea">
      <button class="btn-yes" onclick="sayYes()">Да 🥳</button>
      <button class="btn-no" id="btnNo" onmouseover="runAway()" ontouchstart="runAway()">Нет 😅</button>
    </div>
  </div>

  <!-- modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="emoji">🎉💗</div>
      <h2>Ура! Жду в игре! 🥳</h2>
    </div>
  </div>

  <script>
    const btn = document.getElementById('btnNo');
    const area = document.getElementById('btnArea');

    function runAway() {
      const areaRect = area.getBoundingClientRect();
      const btnRect  = btn.getBoundingClientRect();

      // random offset
      const maxX = window.innerWidth  - btnRect.width  - 20;
      const maxY = window.innerHeight - btnRect.height - 20;

      const newX = Math.random() * maxX;
      const newY = Math.random() * maxY;

      btn.style.position = 'fixed';
      btn.style.left = newX + 'px';
      btn.style.top  = newY + 'px';
      btn.style.right = 'auto';
      btn.style.zIndex = 99;
    }

    function sayYes() {
      document.getElementById('modal').classList.add('show');
    }
  </script>
</body>
</html>
